name: Build XCFramework

on:
  push:
    branches: [main]
    paths:
      - "Rust/**"
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "scripts/build-xcframework.sh"
      - ".github/workflows/build-xcframework.yml"
  pull_request:
    branches: [main]
    paths:
      - "Rust/**"
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "scripts/build-xcframework.sh"
      - ".github/workflows/build-xcframework.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opaque-swift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test Rust core
        run: cargo test --manifest-path Rust/Cargo.toml

      - name: Build XCFramework
        run: ./scripts/build-xcframework.sh

      - name: Test Swift package
        run: swift test

      - name: Commit generated binary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Artifacts/COpaque.xcframework Rust/Cargo.lock
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Build COpaque XCFramework"
          git push
