[package]
name = "opaque-swift-ffi"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
opaque-ke = { version = "=4.0.1", default-features = false, features = ["ristretto255", "argon2", "std"] }
rand = "0.8"
sha2 = { version = "0.10", default-features = false }
